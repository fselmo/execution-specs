name: Create Fixture Release

on:
  push:
    tags:
      - "tests-*@v*"
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      feature_name: ${{ steps.matrix.outputs.feature_name }}
      combine_labels: ${{ steps.matrix.outputs.combine_labels }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
      - uses: ./.github/actions/setup-uv

      - name: Generate build matrix
        id: matrix
        shell: bash
        run: |
          FEATURE_PREFIX="${GITHUB_REF_NAME//@*/}"
          FEATURE_NAME="${FEATURE_PREFIX#tests-}"
          uv run -q .github/scripts/generate_build_matrix.py "$FEATURE_NAME" >> "$GITHUB_OUTPUT"

  build:
    name: fill (${{ matrix.label || matrix.feature }})
    needs: setup
    runs-on: [self-hosted-ghr, size-gigachungus-x64]
    timeout-minutes: 1440
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.setup.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Fetch lllc
        uses: ./.github/actions/fetch-binary
        with:
          version: v1.0.0
          repo_owner: felix314159
          repo_name: lllc-custom
          remote_name: lllc
          binary_name: lllc
          expected_sha256: 865a0d5379acb3b5471337b5dcf686a2dd71587c6b65b9da6c963de627e0b300

      - name: Fetch Solidity
        uses: ./.github/actions/fetch-binary
        with:
          version: v0.8.24
          repo_owner: ethereum
          repo_name: solidity
          remote_name: solc-static-linux
          binary_name: solc
          expected_sha256: fb03a29a517452b9f12bcf459ef37d0a543765bb3bbc911e70a87d6a37c30d5f

      - uses: ./.github/actions/build-fixtures
        with:
          release_name: ${{ matrix.feature }}
          from_fork: ${{ matrix.from_fork }}
          until_fork: ${{ matrix.until_fork }}
          split_label: ${{ matrix.label }}
          extra_args: ${{ matrix.extra_args }}

  combine:
    name: combine (${{ needs.setup.outputs.feature_name }})
    needs: [setup, build]
    if: needs.setup.outputs.combine_labels != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
      - uses: ./.github/actions/setup-uv
      - name: Install pigz
        run: sudo apt-get install -y pigz
      - name: Download and merge split artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          COMBINE_LABELS: ${{ needs.setup.outputs.combine_labels }}
        run: |
          mkdir -p combined
          for label in $COMBINE_LABELS; do
            echo "Downloading: fixtures__${label}"
            if gh run download "$RUN_ID" -n "fixtures__${label}" --dir "split_artifacts/fixtures__${label}"; then
              cp -r "split_artifacts/fixtures__${label}"/* combined/
            else
              echo "No artifact for ${label} (no tests collected, skipping)"
            fi
          done
          echo "Combined directory contents:"
          find combined -maxdepth 3 -type d | head -30 || true
      - name: Merge split index files
        shell: bash
        env:
          COMBINE_LABELS: ${{ needs.setup.outputs.combine_labels }}
        run: |
          SPLIT_DIRS=()
          for label in $COMBINE_LABELS; do
            dir="split_artifacts/fixtures__${label}"
            if [ -d "$dir" ]; then
              SPLIT_DIRS+=("$dir")
            fi
          done
          if [ ${#SPLIT_DIRS[@]} -gt 0 ]; then
            uv run python .github/scripts/merge_index_files.py combined/.meta/index.json "${SPLIT_DIRS[@]}"
          fi
      - name: Merge per-split RSS metrics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          COMBINE_LABELS: ${{ needs.setup.outputs.combine_labels }}
        run: |
          # Download all `rss_metrics__<label>` artifacts into per-label
          # directories, then merge them into a single per_test_rss.json
          # keyed on nodeid (max wins when a nodeid appears in multiple
          # cells — conservative budget for the next release).
          mkdir -p rss_artifacts
          for label in $COMBINE_LABELS; do
            gh run download "$RUN_ID" \
              -n "rss_metrics__${label}" \
              --dir "rss_artifacts/${label}" \
              || echo "No rss_metrics__${label} (bootstrap or no tests)"
          done
          uv run python - <<'PY'
          import json
          from pathlib import Path

          merged: dict[str, int] = {}
          for partial in Path("rss_artifacts").rglob("per_test_rss.json"):
              try:
                  data = json.loads(partial.read_text())
              except (OSError, json.JSONDecodeError):
                  print(f"Skipping unreadable {partial}")
                  continue
              for nodeid, rss in data.items():
                  if int(rss) > merged.get(nodeid, 0):
                      merged[nodeid] = int(rss)

          # Drop per-split RSS noise from combined/.meta/ so the release
          # tarball doesn't ship stale per-worker partials or a single
          # split's half of the merged map.
          meta = Path("combined/.meta")
          if meta.exists():
              for stale in meta.glob("per_test_rss*.json"):
                  stale.unlink()

          if merged:
              blob = json.dumps(merged, indent=2, sort_keys=True)
              Path("per_test_rss.json").write_text(blob)
              if meta.exists():
                  (meta / "per_test_rss.json").write_text(blob)
              print(f"Merged {len(merged)} nodeids into per_test_rss.json")
          else:
              print("No RSS metrics to merge (bootstrap run)")
          PY
      - name: Upload combined RSS metrics
        if: hashFiles('per_test_rss.json') != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: per_test_rss_${{ needs.setup.outputs.feature_name }}
          path: per_test_rss.json
      - name: Free disk space
        run: rm -rf split_artifacts/ rss_artifacts/
      - name: Create release tarball
        shell: bash
        env:
          FEATURE_NAME: ${{ needs.setup.outputs.feature_name }}
        run: |
          uv run -q .github/scripts/create_release_tarball.py combined "fixtures_${FEATURE_NAME}.tar.gz"
      - name: Upload combined fixture tarball
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fixtures_${{ needs.setup.outputs.feature_name }}
          path: fixtures_${{ needs.setup.outputs.feature_name }}.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [setup, build, combine]
    if: always() && needs.build.result == 'success' && (needs.combine.result == 'success' || needs.combine.result == 'skipped') && startsWith(github.ref, 'refs/tags/tests-')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          fetch-depth: 0

      - name: Download release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" -p "fixtures_*" --dir ./artifacts
          rm -rf ./artifacts/fixtures__*/
          gh run download "$RUN_ID" -p "benchmark_genesis_*" --dir ./artifacts || true
          gh run download "$RUN_ID" -p "per_test_rss_*" --dir ./artifacts || true

      - name: Draft release on EELS (canonical)
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          FEATURE_NAME: ${{ needs.setup.outputs.feature_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          FEATURE_PREFIX="${TAG_NAME%%@*}"
          PREV_TAG=$(
            git tag --list "${FEATURE_PREFIX}@v*" --sort=-v:refname \
              | grep -v "^${TAG_NAME}$" \
              | head -n 1 \
            || true
          )
          RELEASE_ARGS=(--draft --generate-notes)
          if [ "$FEATURE_NAME" != "mainnet" ]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          if [ -n "$PREV_TAG" ]; then
            RELEASE_ARGS+=(--notes-start-tag "$PREV_TAG")
          fi
          # Collect assets fresh here rather than round-tripping through a
          # step output — avoids the multiline-output + mapfile dance and
          # any quoting surprises in interpolated paths.
          ASSETS=()
          while IFS= read -r f; do ASSETS+=("$f"); done < <(
            find ./artifacts -type f \( -name '*.tar.gz' -o -name 'per_test_rss.json' \)
          )
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No release assets found under ./artifacts" >&2
            exit 1
          fi
          gh release create "$TAG_NAME" "${RELEASE_ARGS[@]}" "${ASSETS[@]}"

      - name: Draft release on EEST (mirror)
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          FEATURE_NAME: ${{ needs.setup.outputs.feature_name }}
          GH_TOKEN: ${{ secrets.EEST_RELEASE_TOKEN }}
        run: |
          EEST_TAG="${TAG_NAME#tests-}"
          RELEASE_ARGS=(--repo ethereum/execution-spec-tests --draft)
          if [ "$FEATURE_NAME" != "mainnet" ]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          RELEASE_ARGS+=(--notes "This release is mirrored from [ethereum/execution-specs ${TAG_NAME}](https://github.com/ethereum/execution-specs/releases/tag/${TAG_NAME}).")
          ASSETS=()
          while IFS= read -r f; do ASSETS+=("$f"); done < <(
            find ./artifacts -type f \( -name '*.tar.gz' -o -name 'per_test_rss.json' \)
          )
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No release assets found under ./artifacts" >&2
            exit 1
          fi
          gh release create "$EEST_TAG" "${RELEASE_ARGS[@]}" "${ASSETS[@]}"
