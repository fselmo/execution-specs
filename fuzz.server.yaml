# Snapshot of the server's fuzz.yaml (gitignored there), 2026-09-23.
# Committed under another name so the laptop can read and merge it;
# `fuzz ... --config fuzz.server.yaml` uses it as is, patch paths included.
clients:
  # Detection campaigns track the devnet branch head on purpose.
  - name: geth
    build: {recipe: geth, ref: glamsterdam-devnet-8}
  - name: erigon
    build: {recipe: erigon, ref: glamsterdam-devnet-8}
  - name: besu
    build: {recipe: besu, ref: glamsterdam-devnet-8}
    env: {JAVA_HOME: /home/fselmo/jdk/jdk-25.0.4.1+1,
          PATH: "/home/fselmo/jdk/jdk-25.0.4.1+1/bin:/usr/local/go/bin:/usr/bin:/bin"}
  - name: nethermind
    build: {recipe: nethermind, ref: glamsterdam-devnet-8}
    env: {DOTNET_ROOT: /home/fselmo/.dotnet,
          PATH: "/home/fselmo/.dotnet:/usr/local/go/bin:/usr/bin:/bin"}

  # Gate clients are pinned by full 40-char SHA: the marker becomes
  # ref-<sha> and is immutable. Abbreviated SHAs fail to fetch.
  # Pre-fix erigon. Like besu-gate, the binary the `erigon` entry built at
  # this commit -- the one amsterdam-blind recorded (3.7.0-dev-1880a8e3).
  - name: erigon-gate
    path: ~/.cache/eels-fuzz/erigon/1880a8e319aef66cbd752515e4c55bd08fd83394/evm
  # Pre-fix besu, the campaign's positive control. Points at the binary the
  # `besu` entry already built at this commit -- the cache is commit-keyed,
  # so a rebuild onto a newer head leaves it in place. A build entry here
  # would re-clone besu and re-run gradle for a byte-identical artifact.
  # Rebuild it properly if the cache is ever pruned.
  - name: besu-gate
    path: ~/.cache/eels-fuzz/besu/eea3174daed416bb092b122389759765e240b53f/evmtool
    env: {JAVA_HOME: /home/fselmo/jdk/jdk-25.0.4.1+1,
          PATH: "/home/fselmo/jdk/jdk-25.0.4.1+1/bin:/usr/local/go/bin:/usr/bin:/bin"}
  # Pre-fix parent of 7150854c (PR 12965); verified 0 occurrences of
  # Eip8037_nested_exceptional_halts_burn_spilled_state_gas.
  - name: nethermind-gate
    build:
      recipe: nethermind
      repo: NethermindEth/nethermind
      ref: 436332584f6f5d93ea95fbab0905de940c91e07c
    env: {DOTNET_ROOT: /home/fselmo/.dotnet,
          PATH: "/home/fselmo/.dotnet:/usr/local/go/bin:/usr/bin:/bin"}

  # Producer: evmone's t8n fills batches; EELS adjudicates only what the
  # panel disagrees on. Pinned by full SHA -- the Amsterdam t8n commit.
  - name: evmone-producer
    build:
      recipe: evmone-t8n
      repo: ethereum/evmone
      ref: a46647255cff7cb0f1a0d92f0101f5b3456e0e5e

  # devnet-11 panel. The devnet tracks client mainlines, not a
  # glamsterdam-devnet-11 branch -- no such branch exists on any client.
  # Pinned to the heads resolved 2026-09-22; mainline moves, so a rerun
  # is a different panel unless these SHAs are kept.
  - name: geth-d11
    build: {recipe: geth, repo: ethereum/go-ethereum,
            ref: 5b5c9d06810f8dfcc092e8d1c35b34c11fa9b8fe}
  - name: erigon-d11
    build: {recipe: erigon, repo: erigontech/erigon,
            ref: f099f0161ade159a442bde9328acf35e9e3b5742}
  - name: besu-d11
    build: {recipe: besu, repo: besu-eth/besu,
            ref: 028f9d7391b1a85885a87d6c6f931bad7610da8c}
    env: {JAVA_HOME: /home/fselmo/jdk/jdk-25.0.4.1+1,
          PATH: "/home/fselmo/jdk/jdk-25.0.4.1+1/bin:/usr/local/go/bin:/usr/bin:/bin"}
  - name: nethermind-d11
    build: {recipe: nethermind, repo: NethermindEth/nethermind,
            ref: 0aacb82fa8da8999ce0e68d85a8cb15202f36094}
    env: {DOTNET_ROOT: /home/fselmo/.dotnet,
          PATH: "/home/fselmo/.dotnet:/usr/local/go/bin:/usr/bin:/bin"}

  # Parallel-path panel. Each entry's runner takes the BAL parallel path
  # and its contrast is the same binary sequential, so a mismatch is one
  # client disagreeing with itself across paths -- no spec, no peer.
  # Bases are the devnet-8 heads the series were cut against; a series
  # that stops applying means upstream touched the runner.
  - name: geth-par
    build:
      recipe: geth
      ref: glamsterdam-devnet-8
      patches:
        - patches/geth/0001-cmd-evm-add-bal.sequential-to-blocktest.patch
        - patches/geth/0002-tests-attach-a-fixture-s-block-access-list-to-the-bl.patch
    contrast_flags: [--bal.sequential]
  # Erigon needs no series: it feeds the BAL by default, so the vote is
  # already the parallel path and only the contrasts have to be asked for.
  # They are different questions: IGNORE_BAL drops the BAL's scheduling
  # hints while the executor stays parallel; EXEC3_WORKERS=1 is serial.
  - name: erigon-par
    build: {recipe: erigon, ref: glamsterdam-devnet-8}
    contrasts:
      hints-off: {env: {IGNORE_BAL: "true"}}
      serial: {env: {EXEC3_WORKERS: "1"}}
  - name: besu-par
    build:
      recipe: besu
      ref: glamsterdam-devnet-8
      patches:
        - patches/besu/0001-referencetests-let-a-caller-ask-for-the-parallel-blo.patch
        - patches/besu/0002-evmtool-run-block-test-on-the-parallel-path-on-the-f.patch
        - patches/besu/0003-core-print-the-parallel-processor-s-sequential-fallb.patch
      # 0003 prints the fallback in ethereum/core, a client file; it is
      # admitted by name, beside the recipe's runner paths.
      patch_paths:
        - ethereum/evmtool/
        - ethereum/referencetests/
        - ethereum/core/src/main/java/org/hyperledger/besu/ethereum/mainnet/parallelization/MainnetParallelBlockProcessor.java
    contrast_flags: [--bal.sequential]
    env: {JAVA_HOME: /home/fselmo/jdk/jdk-25.0.4.1+1,
          PATH: "/home/fselmo/jdk/jdk-25.0.4.1+1/bin:/usr/local/go/bin:/usr/bin:/bin"}
  - name: nethermind-par
    build:
      recipe: nethermind
      ref: glamsterdam-devnet-8
      patches:
        - patches/nethermind/0001-Ethereum.Test.Base-attach-a-fixture-s-block-access-l.patch
        - patches/nethermind/0002-Consensus-print-the-sequential-retry-of-a-parallel-B.patch
      # 0002 prints the retry in Nethermind.Consensus, a client file; it is
      # admitted by name, beside the recipe's runner paths.
      patch_paths:
        - src/Nethermind/Nethermind.Test.Runner/
        - src/Nethermind/Ethereum.Test.Base/
        - src/Nethermind/Nethermind.Consensus/Processing/BranchProcessor.cs
    runner_flags: [--parallelExecution, "true"]
    contrast_flags: [--parallelExecution, "false"]
    env: {DOTNET_ROOT: /home/fselmo/.dotnet,
          PATH: "/home/fselmo/.dotnet:/usr/local/go/bin:/usr/bin:/bin"}

  # Parallel-path panel on the devnet-11 heads (mainline, pinned 2026-09-22).
  # geth's and nethermind's series apply unchanged; besu's is ported
  # (patches/besu-d11), since its three files moved. On this head besu
  # falls back to sequential on any parallel failure, list or not, so its
  # BAL-FALLBACK line is a masked failure like nethermind's BAL-RETRY.
  - name: geth-par-d11
    build:
      recipe: geth
      repo: ethereum/go-ethereum
      ref: 5b5c9d06810f8dfcc092e8d1c35b34c11fa9b8fe
      patches:
        - patches/geth/0001-cmd-evm-add-bal.sequential-to-blocktest.patch
        - patches/geth/0002-tests-attach-a-fixture-s-block-access-list-to-the-bl.patch
    contrast_flags: [--bal.sequential]
  - name: erigon-par-d11
    build: {recipe: erigon, repo: erigontech/erigon,
            ref: f099f0161ade159a442bde9328acf35e9e3b5742}
    contrasts:
      hints-off: {env: {IGNORE_BAL: "true"}}
      serial: {env: {EXEC3_WORKERS: "1"}}
  - name: besu-par-d11
    build:
      recipe: besu
      repo: besu-eth/besu
      ref: 028f9d7391b1a85885a87d6c6f931bad7610da8c
      patches:
        - patches/besu-d11/0001-referencetests-let-a-caller-ask-for-the-parallel-blo.patch
        - patches/besu-d11/0002-evmtool-run-block-test-on-the-parallel-path-on-the-f.patch
        - patches/besu-d11/0003-core-print-the-parallel-processor-s-sequential-fallb.patch
      patch_paths:
        - ethereum/evmtool/
        - ethereum/referencetests/
        - ethereum/core/src/main/java/org/hyperledger/besu/ethereum/mainnet/parallelization/MainnetParallelBlockProcessor.java
    env: {JAVA_HOME: /home/fselmo/jdk/jdk-25.0.4.1+1,
          PATH: "/home/fselmo/jdk/jdk-25.0.4.1+1/bin:/usr/local/go/bin:/usr/bin:/bin"}
    contrast_flags: [--bal.sequential]
  - name: nethermind-par-d11
    build:
      recipe: nethermind
      repo: NethermindEth/nethermind
      ref: 0aacb82fa8da8999ce0e68d85a8cb15202f36094
      # nethermind-d11, not nethermind: the devnet-8 series applies here but
      # does not compile (StorageChange takes a UInt256 value on this head).
      patches:
        - patches/nethermind-d11/0001-Ethereum.Test.Base-attach-a-fixture-s-block-access-l.patch
        - patches/nethermind-d11/0002-Consensus-print-the-sequential-retry-of-a-parallel-B.patch
      patch_paths:
        - src/Nethermind/Nethermind.Test.Runner/
        - src/Nethermind/Ethereum.Test.Base/
        - src/Nethermind/Nethermind.Consensus/Processing/BranchProcessor.cs
    env: {DOTNET_ROOT: /home/fselmo/.dotnet,
          PATH: "/home/fselmo/.dotnet:/usr/local/go/bin:/usr/bin:/bin"}
    runner_flags: [--parallelExecution, "true"]
    contrast_flags: [--parallelExecution, "false"]

  # Current Glamsterdam development heads (mainline default branches,
  # resolved 2026-09-24; no devnet past 11 has a branch of its own). Stock
  # builds sit beside the series builds for the liveness check.
  - name: geth-par-main
    build:
      recipe: geth
      repo: ethereum/go-ethereum
      ref: 920c07774c65ebb3023536f85df642c44478b540
      patches:
        - patches/geth-main/0001-cmd-evm-add-bal.sequential-to-blocktest.patch
        - patches/geth-main/0002-tests-attach-a-fixture-s-block-access-list-to-the-bl.patch
        - patches/geth-main/0003-core-print-the-parallel-execution-decision-for-each-.patch
      # 0003 prints FUZZ-PAR-DECISION in core, admitted by name.
      patch_paths: [cmd/evm/, tests/, core/state_processor.go]
    contrast_flags: [--bal.sequential]
  - name: geth-main
    build: {recipe: geth, repo: ethereum/go-ethereum, ref: 920c07774c65ebb3023536f85df642c44478b540}
  - name: erigon-par-main
    build:
      recipe: erigon
      repo: erigontech/erigon
      ref: 01c118ee1fb0f0df4bcf2b9085602f75f5607b19
      # Its only patch prints FUZZ-PAR-DECISION at the BAL feed.
      patches:
        - patches/erigon-main/0001-stagedsync-print-the-parallel-execution-decision-for.patch
      patch_paths: [cmd/evm/, execution/stagedsync/exec3.go]
    contrasts:
      hints-off: {env: {IGNORE_BAL: "true"}}
      serial: {env: {EXEC3_WORKERS: "1"}}
  - name: besu-par-main
    build:
      recipe: besu
      repo: besu-eth/besu
      ref: cf89071f9d6dddf7997f35e09929fe059f82ecd1
      # The devnet-11 port plus 0004, the FUZZ-PAR-DECISION print.
      patches:
        - patches/besu-main/0001-referencetests-let-a-caller-ask-for-the-parallel-blo.patch
        - patches/besu-main/0002-evmtool-run-block-test-on-the-parallel-path-on-the-f.patch
        - patches/besu-main/0003-core-print-the-parallel-processor-s-sequential-fallb.patch
        - patches/besu-main/0004-core-print-the-parallel-execution-decision-for-each-.patch
      patch_paths:
        - ethereum/evmtool/
        - ethereum/referencetests/
        - ethereum/core/src/main/java/org/hyperledger/besu/ethereum/mainnet/parallelization/MainnetParallelBlockProcessor.java
        - ethereum/core/src/main/java/org/hyperledger/besu/ethereum/mainnet/AbstractBlockProcessor.java
    env: {JAVA_HOME: /home/fselmo/jdk/jdk-25.0.4.1+1,
          PATH: "/home/fselmo/jdk/jdk-25.0.4.1+1/bin:/usr/local/go/bin:/usr/bin:/bin"}
    contrast_flags: [--bal.sequential]
  - name: besu-main
    build: {recipe: besu, repo: besu-eth/besu, ref: cf89071f9d6dddf7997f35e09929fe059f82ecd1}
    env: {JAVA_HOME: /home/fselmo/jdk/jdk-25.0.4.1+1,
          PATH: "/home/fselmo/jdk/jdk-25.0.4.1+1/bin:/usr/local/go/bin:/usr/bin:/bin"}
  - name: nethermind-par-main
    build:
      recipe: nethermind
      repo: NethermindEth/nethermind
      ref: 5246d0c79940962a277c06268e8fa32ee0dbfb6a
      # nethermind-main: the retry catch's body moved on this head.
      patches:
        - patches/nethermind-main/0001-Ethereum.Test.Base-attach-a-fixture-s-block-access-l.patch
        - patches/nethermind-main/0002-Consensus-print-the-sequential-retry-of-a-parallel-B.patch
        - patches/nethermind-main/0003-Consensus-print-the-parallel-execution-decision-for-.patch
      patch_paths:
        - src/Nethermind/Nethermind.Test.Runner/
        - src/Nethermind/Ethereum.Test.Base/
        - src/Nethermind/Nethermind.Consensus/Processing/BranchProcessor.cs
        - src/Nethermind/Nethermind.Consensus/Processing/BlockAccessListManager.cs
    env: {DOTNET_ROOT: /home/fselmo/.dotnet,
          PATH: "/home/fselmo/.dotnet:/usr/local/go/bin:/usr/bin:/bin"}
    runner_flags: [--parallelExecution, "true"]
    contrast_flags: [--parallelExecution, "false"]
  - name: nethermind-main
    build: {recipe: nethermind, repo: NethermindEth/nethermind, ref: 5246d0c79940962a277c06268e8fa32ee0dbfb6a}
    env: {DOTNET_ROOT: /home/fselmo/.dotnet,
          PATH: "/home/fselmo/.dotnet:/usr/local/go/bin:/usr/bin:/bin"}

campaigns:
  smoke:
    fork: Amsterdam
    clients: [geth, erigon, besu, nethermind]
  amsterdam-blind:
    fork: Amsterdam
    clients: [geth, erigon, besu, nethermind]
    seed_start: 210000
    known: []
  v12-smoke:
    fork: Amsterdam
    clients: [geth, erigon, besu, nethermind]
    seed_start: 900000
    known: []
  nethermind-calibration:
    fork: Amsterdam
    clients: [geth, nethermind, nethermind-gate]
    seed_start: 910000
    known: []
  v13-calibration:
    fork: Amsterdam
    clients: [geth, nethermind, nethermind-gate]
    seed_start: 1000000
    known: []
  discovery-producer:
    fork: Amsterdam
    # The four discovery entries are the result; besu-gate is a positive
    # control. Its known digest 2d29706a fires at ~6% all night, so a
    # silent loop cannot be mistaken for clean devnet heads.
    clients: [geth, erigon, besu, nethermind, besu-gate]
    producer: evmone-producer
    seed_start: 2000000
    known: []
  devnet11:
    fork: Amsterdam
    clients: [geth-d11, erigon-d11, besu-d11, nethermind-d11, besu-gate]
    producer: evmone-producer
    seed_start: 3000000
    known: []
  # Second shard of the same panel on a disjoint seed range. The runner
  # stage is not pipelined, so one campaign leaves ~9 of 16 cores idle;
  # a second fills them. Seeds start far enough above devnet11's range
  # that nine hours of drift cannot overlap.
  devnet11-b:
    fork: Amsterdam
    clients: [geth-d11, erigon-d11, besu-d11, nethermind-d11, besu-gate]
    producer: evmone-producer
    seed_start: 5000000
    known: []
  # Same seed block v11 scored 6.10% on, so the generator step is the
  # only variable. geth-d11 is present so a besu-gate failure is a
  # divergence rather than an all-fail.
  control-rate-v15:
    fork: Amsterdam
    clients: [geth-d11, besu-gate]
    producer: evmone-producer
    seed_start: 210000
    known: []

  # The seed range amsterdam-blind found the erigon BAL signature in
  # (dbf21974, 47 hits from 211542). Every client votes on its parallel
  # path, so a finding that only the parallel path has is visible as the
  # client disagreeing with itself rather than only as a divergence.
  parallel-contrast:
    fork: Amsterdam
    clients: [geth-par, erigon-par, besu-par, nethermind-par]
    producer: evmone-producer
    seed_start: 210000
    known: []
  # Erigon's arm on its own, both named contrasts, through the campaign:
  # the check that each lane compares cases rather than dropping them.
  erigon-contrast:
    fork: Amsterdam
    clients: [geth-par, erigon-par]
    producer: evmone-producer
    seed_start: 2015500
    known: []
  # v16 control rate on control-rate-v15's seed block and panel.
  control-rate-v16:
    fork: Amsterdam
    clients: [geth-d11, besu-gate]
    producer: evmone-producer
    seed_start: 210000
    known: []
  # withdrawal-zero-untouched through the blocktest lane: EELS fills (clean,
  # then with the shape applied) and each client's failures are its kills.
  # The t8n oracle cannot reach nethermind, erigon or besu at these pins.
  wzu-clean:
    fork: Amsterdam
    clients: [geth, erigon, besu, nethermind]
    seed_start: 0
    known: []
  wzu-mutant:
    fork: Amsterdam
    clients: [geth, erigon, besu, nethermind]
    seed_start: 0
    known: []
  # v18 gate on the overnight panel: besu-gate's 2d29706a is the control,
  # and every other client must agree on every case, failers included.
  gate-v18:
    fork: Amsterdam
    clients: [geth-par, erigon-par, besu-par, nethermind-par, besu-gate]
    producer: evmone-producer
    seed_start: 210000
    known: []
  # The first full parallel-lane night: two shards on fresh, disjoint
  # seed ranges (runner-stage pipelining is not built yet).
  parallel-night-a:
    fork: Amsterdam
    clients: [geth-par, erigon-par, besu-par, nethermind-par, besu-gate]
    producer: evmone-producer
    seed_start: 10000000
    known: []
  parallel-night-b:
    fork: Amsterdam
    clients: [geth-par, erigon-par, besu-par, nethermind-par, besu-gate]
    producer: evmone-producer
    seed_start: 20000000
    known: []
  # The parallel campaign on the devnet-11 panel, same bands as the night;
  # all-fail expected 0 now the clients carry #3478's repayment.
  parallel-d11-a:
    fork: Amsterdam
    clients: [geth-par-d11, erigon-par-d11, besu-par-d11, nethermind-par-d11, besu-gate]
    producer: evmone-producer
    seed_start: 30000000
    known: []
  parallel-d11-b:
    fork: Amsterdam
    clients: [geth-par-d11, erigon-par-d11, besu-par-d11, nethermind-par-d11, besu-gate]
    producer: evmone-producer
    seed_start: 40000000
    known: []
  # v20 gate on the devnet-11 panel: besu-gate's 2d29706a is the control;
  # the four -par-d11 clients must agree on every case.
  gate-v20:
    fork: Amsterdam
    clients: [geth-par-d11, erigon-par-d11, besu-par-d11, nethermind-par-d11, besu-gate]
    producer: evmone-producer
    seed_start: 210000
    known: []
  # v20 gate on the current-head panel: besu-gate's 2d29706a is the control.
  gate-v20:
    fork: Amsterdam
    clients: [geth-par-main, erigon-par-main, besu-par-main, nethermind-par-main, besu-gate]
    producer: evmone-producer
    seed_start: 210000
    known: []
  # Continuous discovery on the current heads; besu-gate is the control only.
  #
  # Step 0 (release sources filled at forks/amsterdam 8cbd21987, 26,511
  # tests; and tests-glamsterdam-devnet@v8.1.4, 25,028) -- known
  # disagreements on these pins, listed here rather than in known: where
  # their error text would also hide a genuine BAL finding:
  #   geth-par-main: panics (runner error) on
  #     test_system_call_execution_boundary[...history-one_over] -- a failed
  #     EIP-2935 call must be ignored; reported separately. Test from #3484.
  #   geth-par-main: "access list hash mismatch" on
  #     test_bal_post_execution_calls_net_storage_at_last_index and
  #     test_bal_withdrawals_and_dequeues_net_balance_at_last_index
  #     [forward_all, forward_half] -- rule and tests from a9792ab73 (#3566,
  #     2026-09-17): system calls sharing an index net against its start.
  #   erigon-par-main: "block access list mismatch" on the five history
  #     system-call tests (execution_boundary history exact/one_over,
  #     execution_grant history, reservoir_boundary history x2) -- tests
  #     from bb95255f8 (#3524, 2026-09-10); rule since 8ea50be3c (#2901).
  #   besu-par-main: throws (no verdict; aborts its whole block-test run)
  #     whenever an unchecked pre-block system call fails, where the spec
  #     ignores the failure: system_call_execution_boundary history-one_over
  #     and beacon-one_over, bal_pre_execution_call_failure_keeps_read_drops_write
  #     out_of_gas and revert. Its messages are the two known: entries below.
  #   besu-par-main: "Chain header mismatch" on the same three last-index
  #     tests as geth (a9792ab73); erigon and nethermind pass them.
  #   nethermind-par-main: none. All four pass v8.1.4 in full.
  continuous-main:
    fork: Amsterdam
    clients: [geth-par-main, erigon-par-main, besu-par-main, nethermind-par-main, besu-gate]
    producer: evmone-producer
    seed_start: 50000000
    # Measured on this box, same 2,500 seeds per cap (cases/s): 1: 4.02,
    # 2: 5.34, 3: 5.86, 4: 6.09, 6: 6.36. Still rising slowly at 6.
    runner_concurrency: 6
    known:
      - {client: besu-par-main, reason: "System call halted"}
      - {client: besu-par-main, reason: "System call did not execute to completion"}
    health:
      control: {client: besu-gate, reason: "Chain header mismatch"}
      # besu-gate's 2d29706a ran 4.9-5.6% over 4.8M cases on v15-v20.
      control_band: [0.03, 0.08]
      # Every client's primary is its parallel path on this panel.
      parallel_lanes: [geth-par-main, erigon-par-main, besu-par-main, nethermind-par-main]
      parallel_baseline_blocks: 2000
      parallel_proof_floor: 0.9
  # Runner-cap sweep: the continuous panel on one fixed seed range, per cap.
  cap-sweep-1:
    fork: Amsterdam
    clients: [geth-par-main, erigon-par-main, besu-par-main, nethermind-par-main, besu-gate]
    producer: evmone-producer
    seed_start: 60000000
